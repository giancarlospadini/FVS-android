<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#1a237e">
    <title>La Sfida della Fede - Offline</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600&family=Lora:ital@0;1&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Lora', Georgia, serif;
            background-color: #f5f0e8;
            color: #2c2416;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 40px 24px;
            text-align: center;
        }
        .cross {
            font-size: 4rem;
            color: #c9a84c;
            margin-bottom: 24px;
            opacity: 0.7;
        }
        h1 {
            font-family: 'Playfair Display', Georgia, serif;
            font-size: 1.5rem;
            color: #1a237e;
            margin-bottom: 16px;
        }
        p {
            font-size: 1rem;
            color: #5a4e3c;
            line-height: 1.7;
            max-width: 400px;
            margin-bottom: 12px;
        }
        .prayer {
            font-style: italic;
            color: #8a7e6c;
            margin-top: 32px;
            font-size: 0.9rem;
            line-height: 1.8;
        }
        .retry {
            margin-top: 32px;
            padding: 12px 32px;
            background: #1a237e;
            color: #fff;
            border: none;
            border-radius: 30px;
            font-family: 'Lora', serif;
            font-size: 0.9rem;
            cursor: pointer;
        }
        .ornament {
            color: #c9a84c;
            font-size: 1.2rem;
            letter-spacing: 6px;
            margin: 24px 0;
            opacity: 0.5;
        }
    </style>
</head>
<body>
    <div class="cross">✝</div>
    <h1>Sei offline</h1>
    <p>Non è possibile raggiungere il server in questo momento. Verifica la tua connessione a Internet e riprova.</p>
    <div class="ornament">✦ ✝ ✦</div>
    <div class="prayer">
        «Il Signore è il mio pastore, non manco di nulla.»<br>
        — Salmo 23:1
    </div>
    <button class="retry" onclick="location.reload()">Riprova</button>
</body>
</html>
