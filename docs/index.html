<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#1a237e">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="La Sfida della Fede">
    <meta name="description" content="Citazioni dei Santi e preghiera quotidiana - La Sfida della Fede">
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="icons/icon-192.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&family=Lora:ital,wght@0,400;0,500;0,600;1,400;1,500&display=swap" rel="stylesheet">
    <title>La Sfida della Fede</title>
    <style>
        *, *::before, *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary: #1a237e;
            --primary-light: #283593;
            --primary-dark: #0d1453;
            --accent: #c9a84c;
            --accent-light: #d4bc6a;
            --background: #f5f0e8;
            --background-warm: #efe8da;
            --text-dark: #2c2416;
            --text-medium: #5a4e3c;
            --text-light: #8a7e6c;
            --white: #ffffff;
            --shadow: rgba(26, 35, 126, 0.12);
            --shadow-strong: rgba(26, 35, 126, 0.2);
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: 'Lora', Georgia, 'Times New Roman', serif;
            background-color: var(--background);
            color: var(--text-dark);
            min-height: 100vh;
            overflow-x: hidden;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        /* Parchment texture overlay */
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image:
                radial-gradient(ellipse at 20% 50%, rgba(201, 168, 76, 0.04) 0%, transparent 50%),
                radial-gradient(ellipse at 80% 20%, rgba(26, 35, 126, 0.03) 0%, transparent 50%),
                radial-gradient(ellipse at 50% 80%, rgba(201, 168, 76, 0.03) 0%, transparent 50%);
            pointer-events: none;
            z-index: 0;
        }

        /* Header */
        .header {
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-light) 100%);
            color: var(--white);
            padding: 16px 20px;
            text-align: center;
            position: sticky;
            top: 0;
            z-index: 100;
            box-shadow: 0 4px 20px var(--shadow-strong);
        }

        .header-inner {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            max-width: 600px;
            margin: 0 auto;
        }

        .cross-icon {
            font-size: 28px;
            color: var(--accent);
            filter: drop-shadow(0 2px 4px rgba(0,0,0,0.3));
            animation: gentle-glow 3s ease-in-out infinite;
        }

        @keyframes gentle-glow {
            0%, 100% { opacity: 0.9; }
            50% { opacity: 1; filter: drop-shadow(0 2px 8px rgba(201, 168, 76, 0.5)); }
        }

        .header h1 {
            font-family: 'Playfair Display', Georgia, serif;
            font-size: 1.3rem;
            font-weight: 600;
            letter-spacing: 0.5px;
            text-shadow: 0 2px 4px rgba(0,0,0,0.2);
        }

        .header-subtitle {
            font-family: 'Lora', serif;
            font-size: 0.72rem;
            color: var(--accent-light);
            font-style: italic;
            margin-top: 2px;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        /* Date display */
        .date-display {
            text-align: center;
            padding: 18px 20px 8px;
            position: relative;
            z-index: 1;
        }

        .date-text {
            font-family: 'Lora', serif;
            font-size: 0.9rem;
            color: var(--text-light);
            font-style: italic;
            letter-spacing: 0.5px;
        }

        /* Navigation */
        .nav-controls {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 24px;
            padding: 8px 20px 4px;
            position: relative;
            z-index: 1;
        }

        .nav-btn {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            border: 2px solid var(--accent);
            background: var(--white);
            color: var(--primary);
            font-size: 1.2rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
            box-shadow: 0 2px 8px var(--shadow);
        }

        .nav-btn:hover, .nav-btn:active {
            background: var(--primary);
            color: var(--accent);
            transform: scale(1.05);
            box-shadow: 0 4px 16px var(--shadow-strong);
        }

        .nav-btn:disabled {
            opacity: 0.3;
            cursor: not-allowed;
            transform: none;
        }

        .nav-indicator {
            font-family: 'Lora', serif;
            font-size: 0.8rem;
            color: var(--text-light);
            min-width: 60px;
            text-align: center;
        }

        /* Main content */
        .main-content {
            max-width: 600px;
            margin: 0 auto;
            padding: 12px 16px 100px;
            position: relative;
            z-index: 1;
        }

        /* Saint Card */
        .saint-card {
            background: var(--white);
            border-radius: 20px;
            overflow: hidden;
            box-shadow:
                0 8px 32px var(--shadow),
                0 2px 8px rgba(201, 168, 76, 0.08);
            margin-top: 12px;
            animation: card-enter 0.6s cubic-bezier(0.22, 1, 0.36, 1);
            border: 1px solid rgba(201, 168, 76, 0.15);
        }

        @keyframes card-enter {
            from {
                opacity: 0;
                transform: translateY(20px) scale(0.98);
            }
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        .card-transitioning {
            animation: card-exit 0.3s ease forwards;
        }

        @keyframes card-exit {
            to {
                opacity: 0;
                transform: translateY(-10px) scale(0.98);
            }
        }

        /* Saint Image */
        .saint-image-container {
            position: relative;
            width: 100%;
            max-height: 320px;
            overflow: hidden;
            background: linear-gradient(135deg, var(--primary-dark) 0%, var(--primary) 100%);
        }

        .saint-image {
            width: 100%;
            height: 280px;
            object-fit: cover;
            display: block;
            transition: opacity 0.5s ease;
        }

        .saint-image-overlay {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 80px;
            background: linear-gradient(transparent, rgba(26, 35, 126, 0.7));
        }

        /* Decorative divider */
        .ornament {
            text-align: center;
            padding: 16px 0 8px;
            color: var(--accent);
            font-size: 1.4rem;
            letter-spacing: 8px;
            opacity: 0.6;
        }

        /* Saint Title */
        .saint-title {
            font-family: 'Playfair Display', Georgia, serif;
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--primary);
            text-align: center;
            padding: 0 24px;
            line-height: 1.3;
        }

        /* Saint Excerpt / Quote */
        .saint-excerpt {
            padding: 16px 24px;
            font-size: 1rem;
            line-height: 1.75;
            color: var(--text-medium);
            text-align: justify;
            hyphens: auto;
        }

        .saint-excerpt p {
            margin-bottom: 12px;
        }

        .saint-excerpt p:last-child {
            margin-bottom: 0;
        }

        .saint-excerpt img {
            max-width: 100%;
            height: auto;
            border-radius: 8px;
            margin: 8px 0;
        }

        .saint-excerpt a {
            color: var(--primary);
            text-decoration: none;
            border-bottom: 1px solid var(--accent);
        }

        /* Quote block */
        .saint-quote {
            margin: 16px 24px;
            padding: 20px 24px;
            background: linear-gradient(135deg, var(--background) 0%, var(--background-warm) 100%);
            border-left: 4px solid var(--accent);
            border-radius: 0 12px 12px 0;
            font-style: italic;
            font-size: 1.05rem;
            line-height: 1.7;
            color: var(--text-dark);
            position: relative;
        }

        .saint-quote::before {
            content: '\201C';
            font-family: 'Playfair Display', serif;
            font-size: 3rem;
            color: var(--accent);
            position: absolute;
            top: -5px;
            left: 12px;
            opacity: 0.4;
        }

        /* Prayer section */
        .prayer-section {
            margin: 0 24px 24px;
            padding: 20px;
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-light) 100%);
            border-radius: 16px;
            text-align: center;
        }

        .prayer-label {
            font-family: 'Playfair Display', serif;
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 3px;
            color: var(--accent);
            margin-bottom: 12px;
        }

        .prayer-text {
            font-family: 'Lora', serif;
            font-style: italic;
            font-size: 0.95rem;
            line-height: 1.8;
            color: rgba(255, 255, 255, 0.92);
        }

        /* Read more link */
        .read-more {
            display: block;
            text-align: center;
            padding: 16px 24px 24px;
        }

        .read-more a {
            font-family: 'Lora', serif;
            font-size: 0.85rem;
            color: var(--primary);
            text-decoration: none;
            padding: 10px 24px;
            border: 2px solid var(--accent);
            border-radius: 30px;
            transition: all 0.3s ease;
            display: inline-block;
        }

        .read-more a:hover {
            background: var(--primary);
            color: var(--white);
            border-color: var(--primary);
        }

        /* Dots indicator */
        .dots-indicator {
            display: flex;
            justify-content: center;
            gap: 8px;
            padding: 16px 0 8px;
        }

        .dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--accent);
            opacity: 0.3;
            transition: all 0.3s ease;
            cursor: pointer;
        }

        .dot.active {
            opacity: 1;
            transform: scale(1.3);
            box-shadow: 0 0 8px rgba(201, 168, 76, 0.4);
        }

        /* Loading */
        .loading {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 80px 20px;
            animation: fade-in 0.5s ease;
        }

        @keyframes fade-in {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .loading-cross {
            font-size: 3rem;
            color: var(--accent);
            animation: pulse-cross 2s ease-in-out infinite;
            margin-bottom: 20px;
        }

        @keyframes pulse-cross {
            0%, 100% { transform: scale(1); opacity: 0.7; }
            50% { transform: scale(1.1); opacity: 1; }
        }

        .loading-text {
            font-family: 'Lora', serif;
            font-style: italic;
            color: var(--text-light);
            font-size: 0.95rem;
        }

        /* Error / Offline */
        .error-state {
            text-align: center;
            padding: 60px 30px;
            animation: fade-in 0.5s ease;
        }

        .error-icon {
            font-size: 3rem;
            margin-bottom: 16px;
        }

        .error-title {
            font-family: 'Playfair Display', serif;
            font-size: 1.3rem;
            color: var(--primary);
            margin-bottom: 8px;
        }

        .error-text {
            color: var(--text-light);
            font-size: 0.9rem;
            line-height: 1.6;
        }

        .retry-btn {
            margin-top: 20px;
            padding: 12px 32px;
            background: var(--primary);
            color: var(--white);
            border: none;
            border-radius: 30px;
            font-family: 'Lora', serif;
            font-size: 0.9rem;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .retry-btn:hover {
            background: var(--primary-light);
            transform: translateY(-1px);
        }

        /* Bottom bar */
        .bottom-bar {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: var(--white);
            border-top: 1px solid rgba(201, 168, 76, 0.2);
            padding: 8px 16px calc(8px + env(safe-area-inset-bottom, 0px));
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
            z-index: 100;
            box-shadow: 0 -4px 16px var(--shadow);
        }

        .bottom-bar-text {
            font-family: 'Lora', serif;
            font-size: 0.72rem;
            color: var(--text-light);
            font-style: italic;
        }

        .bottom-bar-cross {
            color: var(--accent);
            font-size: 0.9rem;
        }

        /* Touch swipe area */
        .swipe-area {
            touch-action: pan-y;
        }

        /* Smooth scroll snap feel */
        @media (prefers-reduced-motion: reduce) {
            * {
                animation-duration: 0.01ms !important;
                transition-duration: 0.01ms !important;
            }
        }

        /* Scrollbar */
        ::-webkit-scrollbar {
            width: 4px;
        }

        ::-webkit-scrollbar-track {
            background: var(--background);
        }

        ::-webkit-scrollbar-thumb {
            background: var(--accent);
            border-radius: 2px;
        }
    </style>
</head>
<body>

    <header class="header">
        <div class="header-inner">
            <span class="cross-icon">✝</span>
            <div>
                <h1>La Sfida della Fede</h1>
                <div class="header-subtitle">Fede · Vita · Speranza</div>
            </div>
        </div>
    </header>

    <div class="date-display">
        <span class="date-text" id="dateText"></span>
    </div>

    <div class="nav-controls">
        <button class="nav-btn" id="prevBtn" aria-label="Giorno precedente">‹</button>
        <div class="nav-indicator" id="navIndicator"></div>
        <button class="nav-btn" id="nextBtn" aria-label="Giorno successivo">›</button>
    </div>

    <main class="main-content swipe-area" id="mainContent">
        <div class="loading" id="loadingState">
            <div class="loading-cross">✝</div>
            <div class="loading-text">Caricamento della parola del giorno…</div>
        </div>
    </main>

    <div class="bottom-bar">
        <span class="bottom-bar-cross">✝</span>
        <span class="bottom-bar-text">Fede Vita Speranza — Preghiera quotidiana</span>
        <span class="bottom-bar-cross">✝</span>
    </div>

    <script>
    (function() {
        'use strict';

        const API_URL = 'https://www.fede-vita-speranza.it/wp-json/wp/v2/posts?per_page=7&_embed';
        const CACHE_KEY = 'fvs_posts_cache';
        const CACHE_TIME_KEY = 'fvs_cache_time';
        const CACHE_DURATION = 30 * 60 * 1000; // 30 minutes

        let posts = [];
        let currentIndex = 0;
        let touchStartX = 0;
        let touchEndX = 0;

        // Italian date formatting
        const MONTHS_IT = [
            'Gennaio', 'Febbraio', 'Marzo', 'Aprile', 'Maggio', 'Giugno',
            'Luglio', 'Agosto', 'Settembre', 'Ottobre', 'Novembre', 'Dicembre'
        ];
        const DAYS_IT = [
            'Domenica', 'Lunedì', 'Martedì', 'Mercoledì',
            'Giovedì', 'Venerdì', 'Sabato'
        ];

        function formatDateIT(dateStr) {
            const d = new Date(dateStr);
            return `${DAYS_IT[d.getDay()]} ${d.getDate()} ${MONTHS_IT[d.getMonth()]} ${d.getFullYear()}`;
        }

        function decodeHTML(html) {
            const txt = document.createElement('textarea');
            txt.innerHTML = html;
            return txt.value;
        }

        function stripTags(html) {
            const div = document.createElement('div');
            div.innerHTML = html;
            return div.textContent || div.innerText || '';
        }

        function getExcerpt(text, maxLen) {
            const clean = stripTags(text).trim();
            if (clean.length <= maxLen) return clean;
            return clean.substring(0, maxLen).replace(/\s+\S*$/, '') + '…';
        }

        function getFeaturedImage(post) {
            try {
                const embedded = post._embedded;
                if (embedded && embedded['wp:featuredmedia'] && embedded['wp:featuredmedia'][0]) {
                    const media = embedded['wp:featuredmedia'][0];
                    // Try medium_large first, then full
                    if (media.media_details && media.media_details.sizes) {
                        const sizes = media.media_details.sizes;
                        if (sizes.medium_large) return sizes.medium_large.source_url;
                        if (sizes.large) return sizes.large.source_url;
                    }
                    return media.source_url;
                }
            } catch (e) {}
            return null;
        }

        function extractQuoteAndPrayer(content) {
            // Try to find a blockquote for the quote
            const div = document.createElement('div');
            div.innerHTML = content;

            let quote = '';
            let prayer = '';
            let body = content;

            // Look for blockquotes
            const blockquotes = div.querySelectorAll('blockquote');
            if (blockquotes.length > 0) {
                quote = blockquotes[0].innerHTML;
            }

            // Look for prayer indicators
            const allText = div.innerHTML;
            const prayerRegex = /(?:preghier[ae]|preg[oh]iamo|signore|padre nostro|ave maria|amen)[\s\S]*$/i;
            const prayerMatch = allText.match(prayerRegex);

            // Return structured content
            return { body: content, quote, prayer };
        }

        async function fetchPosts() {
            // Check cache first
            const cached = localStorage.getItem(CACHE_KEY);
            const cacheTime = localStorage.getItem(CACHE_TIME_KEY);

            if (cached && cacheTime && (Date.now() - parseInt(cacheTime)) < CACHE_DURATION) {
                return JSON.parse(cached);
            }

            try {
                const response = await fetch(API_URL);
                if (!response.ok) throw new Error('Network response not ok');
                const data = await response.json();

                // Cache the data
                localStorage.setItem(CACHE_KEY, JSON.stringify(data));
                localStorage.setItem(CACHE_TIME_KEY, Date.now().toString());

                return data;
            } catch (err) {
                // Try cached data even if expired
                if (cached) {
                    return JSON.parse(cached);
                }
                throw err;
            }
        }

        function renderCard(post) {
            const title = decodeHTML(post.title.rendered);
            const imageUrl = getFeaturedImage(post);
            const content = post.content.rendered;
            const excerpt = post.excerpt.rendered;
            const dateFormatted = formatDateIT(post.date);
            const link = post.link;

            const { body, quote, prayer } = extractQuoteAndPrayer(content);

            let html = '<div class="saint-card" id="saintCard">';

            // Image
            if (imageUrl) {
                html += `
                    <div class="saint-image-container">
                        <img class="saint-image" src="${imageUrl}" alt="${title}" loading="lazy"
                             onerror="this.parentElement.style.display='none'">
                        <div class="saint-image-overlay"></div>
                    </div>`;
            }

            // Ornament
            html += '<div class="ornament">✦ ✝ ✦</div>';

            // Title
            html += `<h2 class="saint-title">${title}</h2>`;

            // Quote if found
            if (quote) {
                html += `<div class="saint-quote">${quote}</div>`;
            }

            // Excerpt / Content
            html += `<div class="saint-excerpt">${excerpt}</div>`;

            // Prayer section (use last paragraph or a generic prayer invitation)
            html += `
                <div class="prayer-section">
                    <div class="prayer-label">🕊 Momento di preghiera</div>
                    <div class="prayer-text">
                        Signore, attraverso l'esempio e le parole di questo santo,<br>
                        guidaci nel cammino della fede.<br>
                        Donaci la forza di vivere secondo il Tuo amore.<br>
                        <em>Amen.</em>
                    </div>
                </div>`;

            // Read more
            html += `
                <div class="read-more">
                    <a href="${link}" target="_blank" rel="noopener">Leggi l'articolo completo →</a>
                </div>`;

            html += '</div>';

            // Dots indicator
            if (posts.length > 1) {
                html += '<div class="dots-indicator">';
                for (let i = 0; i < posts.length; i++) {
                    html += `<div class="dot${i === currentIndex ? ' active' : ''}" data-index="${i}"></div>`;
                }
                html += '</div>';
            }

            return html;
        }

        function showPost(index) {
            if (index < 0 || index >= posts.length) return;

            const card = document.getElementById('saintCard');
            if (card) {
                card.classList.add('card-transitioning');
                setTimeout(() => {
                    currentIndex = index;
                    updateUI();
                }, 300);
            } else {
                currentIndex = index;
                updateUI();
            }
        }

        function updateUI() {
            const post = posts[currentIndex];
            const mainContent = document.getElementById('mainContent');
            const dateText = document.getElementById('dateText');
            const navIndicator = document.getElementById('navIndicator');
            const prevBtn = document.getElementById('prevBtn');
            const nextBtn = document.getElementById('nextBtn');

            // Date
            dateText.textContent = formatDateIT(post.date);

            // Nav
            navIndicator.textContent = `${currentIndex + 1} / ${posts.length}`;
            prevBtn.disabled = currentIndex >= posts.length - 1;
            nextBtn.disabled = currentIndex <= 0;

            // Card
            mainContent.innerHTML = renderCard(post);

            // Add dot click listeners
            document.querySelectorAll('.dot').forEach(dot => {
                dot.addEventListener('click', () => {
                    const idx = parseInt(dot.dataset.index);
                    if (idx !== currentIndex) showPost(idx);
                });
            });

            // Scroll to top
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function showError(message) {
            const mainContent = document.getElementById('mainContent');
            mainContent.innerHTML = `
                <div class="error-state">
                    <div class="error-icon">🕊</div>
                    <h2 class="error-title">Connessione non disponibile</h2>
                    <p class="error-text">${message}</p>
                    <button class="retry-btn" onclick="location.reload()">Riprova</button>
                </div>`;
        }

        // Navigation
        document.getElementById('prevBtn').addEventListener('click', () => {
            if (currentIndex < posts.length - 1) showPost(currentIndex + 1);
        });

        document.getElementById('nextBtn').addEventListener('click', () => {
            if (currentIndex > 0) showPost(currentIndex - 1);
        });

        // Touch swipe
        const mainEl = document.getElementById('mainContent');
        mainEl.addEventListener('touchstart', (e) => {
            touchStartX = e.changedTouches[0].screenX;
        }, { passive: true });

        mainEl.addEventListener('touchend', (e) => {
            touchEndX = e.changedTouches[0].screenX;
            const diff = touchStartX - touchEndX;
            if (Math.abs(diff) > 60) {
                if (diff > 0 && currentIndex < posts.length - 1) {
                    // Swipe left → older
                    showPost(currentIndex + 1);
                } else if (diff < 0 && currentIndex > 0) {
                    // Swipe right → newer
                    showPost(currentIndex - 1);
                }
            }
        }, { passive: true });

        // Keyboard navigation
        document.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowLeft' && currentIndex < posts.length - 1) showPost(currentIndex + 1);
            if (e.key === 'ArrowRight' && currentIndex > 0) showPost(currentIndex - 1);
        });

        // Init
        async function init() {
            try {
                posts = await fetchPosts();
                if (posts && posts.length > 0) {
                    currentIndex = 0;
                    updateUI();
                } else {
                    showError('Nessun contenuto disponibile al momento. Riprova più tardi.');
                }
            } catch (err) {
                console.error('Fetch error:', err);
                showError('Non è possibile caricare i contenuti. Verifica la tua connessione e riprova.');
            }
        }

        // Set today's date as default
        const today = new Date();
        document.getElementById('dateText').textContent =
            `${DAYS_IT[today.getDay()]} ${today.getDate()} ${MONTHS_IT[today.getMonth()]} ${today.getFullYear()}`;

        init();

        // Register service worker
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js')
                    .then(reg => console.log('SW registered:', reg.scope))
                    .catch(err => console.log('SW registration failed:', err));
            });
        }
    })();
    </script>
</body>
</html>
