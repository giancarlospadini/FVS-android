plugins {
    id 'com.android.application'
}

android {
    namespace 'it.fedevitasperanza.app'
    compileSdk 34

    defaultConfig {
        applicationId "it.fedevitasperanza.app"
        minSdk 21
        targetSdk 34
        versionCode 1
        versionName "1.0"

        // TWA host and default URL
        manifestPlaceholders = [
            hostName    : "giancarlospadini.github.io",
            defaultUrl  : "https://giancarlospadini.github.io/FVS-android/",
            launcherName: "La Sfida della Fede",
            assetStatements: '[{ "relation": ["delegate_permission/common.handle_all_urls"], ' +
                '"target": { "namespace": "web", "site": "https://giancarlospadini.github.io" } }]'
        ]
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    implementation 'androidx.browser:browser:1.7.0'
}
